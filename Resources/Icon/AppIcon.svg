<!-- MacPhoto Utility's icon (2026-10-27): the family's compact computer
     (the MacMusic Converter, Macintosh Transfer and Macintosh Backup
     Utilities'), its screen showing a 1-bit photograph (mountains and a
     sun in a frame), with a crop badge in the MacMusic manual's red
     (#e0442b). tools/make-icon.sh turns this into Resources/AppIcon.icns. -->
